<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f4f8f3">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'">
  <title>اليوميات</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div class="shell" id="shell">
    <header id="top" class="top"></header>
    <main id="view" tabindex="-1"></main>
    <nav id="nav" class="nav" aria-label="التنقل"></nav>
  </div>
  <div id="shade" class="shade" hidden>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true" tabindex="-1"></section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
