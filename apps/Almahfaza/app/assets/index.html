<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f9f8fd">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>المحفظة</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="top" id="top"></header>
    <main id="view" tabindex="-1"></main>
    <nav class="nav" id="nav" aria-label="التنقل"></nav>
  </div>
  <div class="shade" id="shade" hidden>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1"></section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
